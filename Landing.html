<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AprènCatalà — aprèn català des del mòbil</title>

  <!-- Aquesta pàgina era una SEGONA CÒPIA de la portada. Les dues còpies van
       divergir (el CSS de mòbil d'index.html no va arribar mai aquí) i durant
       un temps tothom que clicava «Inici» des d'una subpàgina aterrava a la
       versió dolenta. El 14 d'agost de 2026 es va consolidar: ara la portada
       és NOMÉS index.html i això és una redirecció.

       Es manté el fitxer, en comptes d'esborrar-lo, perquè Google pot tenir
       l'URL indexada i hi pot haver enllaços externs. El canonical li diu a
       Google quina és la bona; el refresh i el location.replace hi porten la
       gent. NO tornis a posar-hi contingut: seria ressuscitar el parany. -->

  <link rel="canonical" href="https://aprencatala.cat/">
  <meta http-equiv="refresh" content="0; url=./">
  <script>location.replace('./' + location.hash);</script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: #0d1421;
      color: #e8eef7;
      text-align: center;
      padding: 24px;
    }
    a { color: #f59e0b; }
  </style>
</head>
<body>
  <!-- Només ho veu qui tingui el JavaScript desactivat i el refresh bloquejat. -->
  <p>Aquesta pàgina s'ha mogut a <a href="./">aprencatala.cat</a>.</p>
</body>
</html>
